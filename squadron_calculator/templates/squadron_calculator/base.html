<!DOCTYPE html>
<html lang="el">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
                FFXIV Squadron Manager
            {% endblock %}
        </title>

        {% load static %} 
        <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static 'css/styles.css' %}">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
        <style>   
            {% block extra_css %}
            {% endblock %}
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow fixed-top">
            <div class="container">
                <a class="navbar-brand" href="/">
                    FFXIV Squadron
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon">
                    </span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'members' %}">
                                Members
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Missions
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Optimizer
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            {% block content %}
            {% endblock %}
        </div>

        <footer class="text-center footer-dark bg-dark mt-auto py-3 border-top fixed-bottom">
            <p class="small" style="color: #9a9c9e;">
                <strong>
                    © 2025 FFXIV Squadron Manager - Built with Django
                </strong>
            </p>
        </footer>

        
        <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
        {% block extra_js %}
        {% endblock %}
        
    </body>
</html>
