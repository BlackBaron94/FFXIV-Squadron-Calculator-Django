{% for field in form %}
  {% if field.start_group %}
    <div class="row mb-3">
  {% endif %}
    <div class ="col">
      {% if field.field.widget.input_type == 'checkbox' %}
        <div class="d-flex">
          <label for="{{ field.id_for_label }}" class="form-check-label text-info me-2">
            {{ field.label }}
          </label>
          {{ field }}
        </div>
      {% else %}
        <label for={{ field.id_for_label }} class="form-label text-info">
          {{ field.label }}
        </label>
        {{ field }}
      {% endif %}
      {% if field.errors %}
        <div class="text-danger small mt-1">
          {{ field.errors }}
        </div>
      {% endif %}
    </div>
  {% if field.break_group %}
    </div>
  {% endif %}
{% endfor %}
