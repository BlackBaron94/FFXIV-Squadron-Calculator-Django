{% extends 'squadron_calculator/base.html' %}

{% block title %} 
    Mission Optimizer
{% endblock %}

{% block content %}
  <div class="central-wrapper container mt-5">
    <div class="title-board text-center mb-4">
      <h1>
        Mission Optimizer
      </h1>
    </div>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card bg-dark text-white shadow">
            <div class="card-body">
              <form method="post">
                {% csrf_token %}
                {% for field in form %}
                  <div class="mb-3">
                    <label for={{ field.id_for_label }} class="form-label text-info">
                      {{ field.label }}
                    </label>
                    {{ field }}
                  </div>
                {% endfor %}
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
